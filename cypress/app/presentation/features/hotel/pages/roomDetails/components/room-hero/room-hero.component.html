<div class="room-header">
  <h1 class="room-name">{{ unit().name }}</h1>
</div>

<div class="image-description-section">
  <div class="room-image-container">
    <img src="/images/suite2.avif" [alt]="unit().name" class="room-image" />

    <div class="room-meta">
      <div class="room-rating">
        <div class="stars" aria-hidden="true">
          @for (filled of getStars(); track $index) {
            <ng-icon class="star-icon" [name]="filled ? 'bootstrapStarFill' : 'bootstrapStar'" size="20px" aria-hidden="true"></ng-icon>
          }
        </div>
        @if (unit().rating) {
          <span class="rating-text">{{ unit().rating }}</span>
        } @else {
          <span class="rating-text rating-text--muted">Sin valoraciones</span>
        }
        <button type="button" class="btn-view-ratings" (click)="viewRatings.emit()">
          Ver valoraciones
        </button>
      </div>

      <div class="room-price-section">
        <div class="price">
          <span class="price-amount">${{ unit().pricePerNight ?? 0 }}</span>
          <span class="price-period">/noche</span>
        </div>
      </div>
    </div>
  </div>

  <div class="hero-side-content">
    <ng-content select="[room-hero-side]"></ng-content>
  </div>
</div>
