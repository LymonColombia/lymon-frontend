<section class="summary-card" aria-label="Order summary">
  <header class="summary-header">
    <div class="summary-header-icon">
      <ng-icon name="bootstrapBagCheck" size="16px" aria-hidden="true"></ng-icon>
    </div>
    <h2 class="summary-title">Resumen de compra</h2>
  </header>

  <div class="summary-items">
    @for (item of cartItems(); track item.id) {
      <article
        class="summary-item"
        [class.summary-item--active]="selectedItemId() === item.id"
      >
        <button
          class="summary-item-select"
          type="button"
          [attr.aria-pressed]="selectedItemId() === item.id"
          [attr.aria-label]="'Select ' + item.title"
          (click)="onSelectItem(item.id)"
        >
          <img [src]="item.image" [alt]="item.title" class="summary-item-image" />

          <div class="summary-item-main">
            <span class="summary-item-title">{{ item.title }}</span>
            <span class="summary-item-meta">
              <ng-icon [name]="itemTypeIcon(item.type)" size="12px" aria-hidden="true"></ng-icon>
              {{ typeLabel(item.type) }}
            </span>
          </div>
        </button>

        <div class="summary-item-side">
          <span class="summary-item-price">{{ formatCurrency(item.price * item.quantity) }}</span>
          <button
            class="summary-item-remove"
            type="button"
            (click)="onRemoveItem(item.id)"
          >
          <ng-icon name="bootstrapTrash" size="13px"></ng-icon>

          </button>
        </div>
      </article>
    }
  </div>

  <div class="summary-totals">
    <div class="total-row">
      <span>Subtotal</span>
      <span>{{ formatCurrency(totals().subtotal) }}</span>
    </div>
    <div class="total-row">
      <span>Impuesto 19%</span>
      <span>{{ formatCurrency(totals().taxes) }}</span>
    </div>
    <div class="total-row total-row--final">
      <span>Total</span>
      <span>{{ formatCurrency(totals().total) }}</span>
    </div>
    <app-button
      class="checkout-button"
      size="large"
    >
      Proceder al pago
    </app-button>
  </div>
</section>
