<div class="info-section">
  <h2 class="section-title">Información de la Habitación</h2>

  <div class="info-row">
    <div class="stat-card">
      <ng-icon name="bootstrapPeople" size="36px" aria-hidden="true"></ng-icon>
      <span class="stat-number">{{ maxGuests() }}</span>
      <span class="stat-label">Personas</span>
      <span class="stat-sublabel">Capacidad máxima</span>
    </div>

    <div class="beds-card">
      <div class="beds-header">
        <ng-icon class="beds-header-icon" [name]="singleBedIcon" size="18px" aria-hidden="true"></ng-icon>
        <span class="beds-title">
          Camas <span class="beds-total">({{ totalBeds() }} en total)</span>
        </span>
      </div>

      @if (bedBreakdown().length > 0) {
        <div class="beds-grid">
          @for (bed of bedBreakdown(); track bed.type) {
            <div class="bed-chip">
              <ng-icon class="bed-icon" [name]="getBedIcon(bed.type)" size="22px" aria-hidden="true"></ng-icon>
              <div class="bed-info">
                <span class="bed-count">{{ bed.count }}</span>
                <span class="bed-label">{{ bed.label }}</span>
              </div>
            </div>
          }
        </div>
      } @else {
        <p class="empty-beds">Sin información</p>
      }
    </div>

    <div class="stat-card">
      <ng-icon class="stat-icon" [name]="bathIcon" size="36px" aria-hidden="true"></ng-icon>
      <span class="stat-number">{{ bathroomsCount() }}</span>
      <span class="stat-label">{{ bathroomLabel() }}</span>
    </div>
  </div>
</div>
