<section class="hero">
    <div class="back-button-container">
        <app-button type="button" variant="secondary" size="medium" (clicked)="goBack()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6" />
            </svg>
            Volver
        </app-button>
    </div>
    <div class="hero-content">
        <h1 class="hero-title">Encuentra tu habitación perfecta</h1>
        <p class="hero-subtitle">Reserva directamente sin intermediarios</p>
    </div>
</section>

<section class="search-section">
    <div class="container">
        <div class="search-card">
            <div class="search-form">
                <div class="form-group">
                    <label for="checkin">Fecha de Entrada</label>
                    <div class="input-with-icon">
                        <app-input type="date" id="checkin" name="checkin" [hasIcon]="true">
                            <svg icon class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                        </app-input>
                    </div>
                </div>
                <div class="form-group">
                    <label for="checkout">Fecha de Salida</label>
                    <div class="input-with-icon">
                        <app-input type="date" id="checkout" name="checkout" [hasIcon]="true">
                            <svg icon class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                        </app-input>
                    </div>
                </div>
                <div class="form-group">
                    <label for="guests">Huéspedes</label>
                    <div class="input-with-icon">
                        <app-select id="guests" name="guests" [hasIcon]="true" [options]="guestOptions">
                            <svg icon class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                        </app-select>
                    </div>
                </div>
                <app-button class="btn-search" type="button" variant="primary" size="medium">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                    Buscar
                </app-button>
            </div>
        </div>
    </div>
</section>

<section class="rooms-section">
    <div class="container">
        <h2 class="section-title">Habitaciones Disponibles</h2>
        <p class="section-subtitle">Todas nuestras habitaciones están disponibles para las fechas seleccionadas</p>

        <div class="rooms-grid">
            @for (room of rooms(); track room.id) {
                <app-room-card [room]="room" (viewDetails)="goToRoomDetails()"></app-room-card>
            } @empty {
                <p class="empty-rooms-message">No hay habitaciones disponibles en este momento.</p>
            }
        </div>
    </div>
</section>

<app-footer></app-footer>
