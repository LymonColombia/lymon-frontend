<section class="hero">
  <div class="hero-decorations" aria-hidden="true">
    <div class="hero-decoration hero-decoration--top-right"></div>
    <div class="hero-decoration hero-decoration--bottom-left"></div>
  </div>

  @if (isCalendarOpen()) {
    <div class="cal-backdrop" (click)="closeCalendar()" aria-hidden="true"></div>
  }

  <div class="hero-content">
    <p class="hero-eyebrow">Explora alojamientos únicos</p>
    <h1 class="hero-title">
      Encuentra tu habitación<br />
      <span class="hero-title-accent">perfecta</span>
    </h1>
  </div>

  <div class="search-bar">
    <div class="date-trigger-wrapper">
      <div class="search-field">
        <button
          class="date-trigger"
          type="button"
          [class.has-value]="checkInDisplay()"
          (click)="toggleCalendar()"
          [attr.aria-expanded]="isCalendarOpen()"
          aria-label="Seleccionar fecha de entrada">
          <ng-icon class="field-icon" name="bootstrapCalendar" size="15px" aria-hidden="true"></ng-icon>
          <span class="date-trigger-value" [class.is-placeholder]="!checkInDisplay()">
            {{ checkInDisplay() ?? 'dd/mm/aaaa' }}
          </span>
        </button>
        <label class="search-label">Fecha de Entrada</label>
      </div>

      <div class="search-field">
        <button
          class="date-trigger"
          type="button"
          [class.has-value]="checkOutDisplay()"
          (click)="toggleCalendar()"
          [attr.aria-expanded]="isCalendarOpen()"
          aria-label="Seleccionar fecha de salida">
          <ng-icon class="field-icon" name="bootstrapCalendar" size="15px" aria-hidden="true"></ng-icon>
          <span class="date-trigger-value" [class.is-placeholder]="!checkOutDisplay()">
            {{ checkOutDisplay() ?? 'dd/mm/aaaa' }}
          </span>
        </button>
        <label class="search-label">Fecha de Salida</label>
      </div>

      <div class="cal-dropdown" [class.is-open]="isCalendarOpen()" role="dialog" aria-label="Calendario de fechas">
        <app-calendar
          [initialStartDate]="checkInDate()"
          [initialEndDate]="checkOutDate()"
          (dateRangeChange)="onDateRangeChange($event)"
          (closeRequested)="closeCalendar()">
        </app-calendar>
      </div>
    </div>

    <fieldset class="search-field">
      <legend class="search-label">Huéspedes</legend>
      <div class="guest-stepper">
        <button
          type="button"
          class="stepper-btn"
          (click)="decrementGuests()"
          [disabled]="minGuests() <= MIN_GUESTS"
          aria-label="Reducir huéspedes">
          −
        </button>
        <span class="stepper-value">
          <ng-icon name="bootstrapPeopleFill" size="14px" aria-hidden="true"></ng-icon>
          <span class="stepper-count">{{ minGuests() }}</span>
        </span>
        <button
          type="button"
          class="stepper-btn"
          (click)="incrementGuests()"
          [disabled]="minGuests() >= MAX_GUESTS"
          aria-label="Aumentar huéspedes">
          +
        </button>
      </div>
    </fieldset>

    <button class="btn-search" type="button" (click)="onSearch()">
      <ng-icon name="bootstrapSearch" size="16px" aria-hidden="true"></ng-icon>
      Buscar
    </button>
  </div>
</section>
