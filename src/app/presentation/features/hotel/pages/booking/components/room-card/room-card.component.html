<article class="room-card" [class.featured]="room().featured ?? false">
  <div class="room-image">
    <img
      class="room-image-photo"
      src="/images/suite2.avif"
      [alt]="'Imagen de ' + room().title"
    />
    <div class="room-badge" [class.popular]="room().badgeVariant === 'popular'">
      {{ room().badgeLabel }}
    </div>
  </div>

  <div class="room-content">
    <div class="room-header">
      <h3 class="room-title">{{ room().title }}</h3>
      <div class="room-price">
        <span class="price-amount">${{ room().price }}</span>
        <span class="price-period">/ noche</span>
      </div>
    </div>

    <p class="room-description">{{ room().description }}</p>

    <div class="room-features">
      @for (feature of room().features; track feature.label) {
        <div class="feature">
          <ng-icon class="feature-icon" [name]="feature.icon" size="18px" aria-hidden="true"></ng-icon>
          <span>{{ feature.label }}</span>
        </div>
      }
    </div>

    <div class="room-amenities">
      @for (amenity of room().amenities; track amenity) {
        <span class="amenity">{{ amenity }}</span>
      }
    </div>

    <app-button type="button" variant="primary" size="medium" [fullWidth]="true" (clicked)="onViewDetails()">
      Ver Detalles
    </app-button>
  </div>
</article>
