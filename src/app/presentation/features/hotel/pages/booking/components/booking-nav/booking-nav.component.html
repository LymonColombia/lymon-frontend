<nav class="booking-nav">
  <div class="nav-inner">
    <div class="brand-group">
      <a routerLink="/lyhost" class="brand-link">
        <img
          ngSrc="images/LyHost.svg"
          width="180"
          height="42"
          priority
          alt="Lymon"
          class="brand-logo"
        />
      </a>
    </div>

    <div class="nav-actions">
      @if (isAuthenticated()) {
        @if (guestName()) {
          <span class="guest-name">{{ guestName() }}</span>
        }
        <app-button variant="secondary" size="medium" (clicked)="myReservationsClicked.emit()">
          <ng-icon name="bootstrapCalendar2Check" size="18px" aria-hidden="true"></ng-icon>
          Mis reservas
        </app-button>
        <app-button variant="secondary" size="medium" (clicked)="logoutClicked.emit()">
          <ng-icon name="bootstrapBoxArrowRight" size="18px" aria-hidden="true"></ng-icon>
          Cerrar sesión
        </app-button>
      } @else {
        <app-button variant="primary" size="medium" (clicked)="loginClicked.emit()">
          <ng-icon name="bootstrapBoxArrowInRight" size="18px" aria-hidden="true"></ng-icon>
          Iniciar sesión
        </app-button>
      }
    </div>
  </div>
</nav>
