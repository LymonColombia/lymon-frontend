<article class="property-card">
  <div class="property-card-content">
    <div class="property-visual" aria-hidden="true">
      @switch (property().propertyType) {
        @case ('HOTEL') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <path d="M9 21V8h6v13"></path>
            <path d="M9 12h6"></path>
          </svg>
        }
        @case ('CASA') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10.5L12 3l9 7.5"></path>
            <path d="M5 10v10h14V10"></path>
            <path d="M10 20v-6h4v6"></path>
          </svg>
        }
        @case ('APARTAMENTO') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="3" width="16" height="18" rx="2"></rect>
            <path d="M8 7h.01M12 7h.01M16 7h.01M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01"></path>
          </svg>
        }
        @case ('VILLA') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10.5L12 3l9 7.5"></path>
            <path d="M5 10v10h14V10"></path>
            <path d="M18 6l2-2"></path>
            <path d="M7 20v-6h4v6"></path>
          </svg>
        }
        @case ('HOSTAL') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18"></path>
            <path d="M5 12V8a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4"></path>
            <path d="M3 17v-5"></path>
            <path d="M21 17v-5"></path>
          </svg>
        }
        @case ('GLAMPING') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 4L4 20h16L12 4z"></path>
            <path d="M12 9v11"></path>
            <path d="M8.5 15h7"></path>
          </svg>
        }
        @default {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10.5L12 3l9 7.5"></path>
            <path d="M5 10v10h14V10"></path>
          </svg>
        }
      }
    </div>

    <div class="property-details">
      <h3 class="property-name">{{ property().name }}</h3>

      <div class="property-meta">
        <p class="property-city">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          {{ property().city }}
        </p>

        <span class="property-badge" [attr.aria-label]="'Tipo: ' + propertyTypeLabel()">
          {{ propertyTypeLabel() }}
        </span>
      </div>
    </div>
  </div>

  <div class="property-card-actions">
    <app-button type="button" variant="outline" (clicked)="onViewUnits()">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect x="1" y="3" width="15" height="13" rx="2"></rect>
        <path d="M16 8h4l3 3v5h-7V8z"></path>
      </svg>
      Ver Unidades
    </app-button>
  </div>
</article>
