<app-header>
    <app-button actions type="button" variant="secondary" size="medium" (click)="onBackToExperiences()" (keydown.enter)="onBackToExperiences()">
        <ng-icon name="bootstrapChevronLeft" size="18px" aria-hidden="true"></ng-icon>
        Volver
    </app-button>
</app-header>

<section class="experience-detail-page">
  @if (isLoading()) {
    <div class="detail-state">Cargando experiencia...</div>
  } @else if (experience(); as selectedExperience) {
    <experience-detail [experience]="selectedExperience"></experience-detail>
  } @else {
    <div class="detail-state">
      <h2>Experiencia no encontrada</h2>
      <p>La experiencia que intentas ver no existe o ya no esta disponible.</p>
      <button type="button" class="back-button" (click)="onBackToExperiences()">Volver a experiencias</button>
    </div>
  }
</section>

<app-footer></app-footer>
