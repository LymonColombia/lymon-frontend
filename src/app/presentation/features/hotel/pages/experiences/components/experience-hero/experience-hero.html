<section class="hero" aria-label="Sección de experiencias">

  <div class="hero-decorations" aria-hidden="true">
    <div class="hero-decoration hero-decoration--top-right"></div>
    <div class="hero-decoration hero-decoration--bottom-left"></div>
  </div>

  <div class="hero-content">
    <p class="hero-eyebrow">Experiencias</p>
    <h1 class="hero-title">Vive momentos únicos<br />
      <span class="hero-title-accent"> explorando</span>
    </h1>
    <p class="hero-description">Descubre actividades exclusivas, tours y experiencias únicas para complementar tu
      estancia.</p>
  </div>

  <div class="search-bar">
    
    <div class="filters-field">
      <app-select id="category" name="category" [hasIcon]="true" [options]="categoryOptions">
        <ng-icon icon class="field-icon" name="bootstrapClipboard2Check" size="16px" aria-hidden="true"></ng-icon>
      </app-select>
      <label for="category" class="filters-field-label">Tipo de Actividad</label>
    </div>

    <div class="filters-field">
      <app-select id="ownerType" name="ownerType" [hasIcon]="true" [options]="ownerTypeOptions">
        <ng-icon icon class="field-icon" name="bootstrapPerson" size="16px" aria-hidden="true"></ng-icon>
      </app-select>
      <label for="ownerType" class="filters-field-label">Tipo de Propietario</label>
    </div>

    <button class="btn-search" type="button">
      <ng-icon name="bootstrapSearch" size="16px" aria-hidden="true"></ng-icon>
      Buscar
    </button>

  </div>

</section>
