<div class="auth-container">
        <div class="auth-background">
            <div class="logo-background">LYMON</div>
        </div>
        
        
        <div class="auth-content">
            <div class="auth-card">
                <div class="logo-small">
                    <img src="/images/logo.png" alt="Lymon Logo" width="120px" height="60px">
                </div>
                <a href="../../index.html" class="back-button">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            </a>
                <h1 class="auth-title">Crear Cuenta</h1>
                <p class="auth-subtitle">Regístrate para comenzar</p>

                <form class="auth-form">
                    <div class="form-group">
                        <label for="name">Nombre Completo</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="10" cy="7" r="4" stroke="#666" stroke-width="1.5" fill="none"/>
                                <path d="M4 18c0-3.5 2.5-6 6-6s6 2.5 6 6" stroke="#666" stroke-width="1.5" fill="none"/>
                            </svg>
                            <input type="text" id="name" placeholder="Tu nombre" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="#666" stroke-width="1.5" fill="none"/>
                                <path d="M2 5l8 6 8-6" stroke="#666" stroke-width="1.5" fill="none"/>
                            </svg>
                            <input type="email" id="email" placeholder="example@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="4" y="9" width="12" height="9" rx="1" stroke="#666" stroke-width="1.5" fill="none"/>
                                <path d="M7 9V6a3 3 0 0 1 6 0v3" stroke="#666" stroke-width="1.5" fill="none"/>
                            </svg>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirmar Contraseña</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="4" y="9" width="12" height="9" rx="1" stroke="#666" stroke-width="1.5" fill="none"/>
                                <path d="M7 9V6a3 3 0 0 1 6 0v3" stroke="#666" stroke-width="1.5" fill="none"/>
                            </svg>
                            <input type="password" id="confirm-password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="terms" required>
                            <span class="checkbox-label">Acepto los <span style="color: #009A44; text-decoration: underline;">términos y condiciones</span></span>
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">
                        <span>Crear Cuenta</span>
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 10h10M12 7l3 3-3 3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>

                    <p style="text-align: center; margin-top: 16px; font-family: 'Syne', sans-serif; font-size: 14px; color: #666;">
                        ¿Ya tienes cuenta? <a href="../login/index.html" style="color: #009A44; text-decoration: none; font-weight: 600;">Inicia Sesión</a>
                    </p>
                </form>
            </div>
        </div>

        <button class="help-button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" fill="white"/>
                <text x="12" y="17" font-family="Syne" font-weight="600" font-size="16" fill="#333" text-anchor="middle">?</text>
            </svg>
        </button>
</div>
