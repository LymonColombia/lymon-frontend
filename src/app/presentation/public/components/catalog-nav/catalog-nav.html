<nav class="catalog-nav">
  <div class="nav-inner">

    <div class="brand-group">
      <a routerLink="/lyhost" class="brand-link">
        <img
          ngSrc="images/LyHost.svg"
          width="180"
          height="42"
          priority
          alt="LyHost"
          class="brand-logo"
        />
      </a>
    </div>

    <div class="nav-center">
      <div class="nav-divider">
      <a class="nav-link" routerLink="/booking" routerLinkActive="nav-link--active">
        <ng-icon name="bootstrapHouseDoor" size="15px" aria-hidden="true" />
          Alojamiento
      </a>
      </div>
      <div class="nav-divider">
      <a class="nav-link" routerLink="/experiences" routerLinkActive="nav-link--active">
        <ng-icon name="bootstrapCompass" size="15px" aria-hidden="true"/>
        Experiencia
      </a>
      </div>
    </div>

    <div class="nav-actions">
      @if (isAuthenticated()) {
        <app-profile-menu
          [email]="guestEmail()"
          (logoutClicked)="logoutClicked.emit()"
          (myReservationsClicked)="myReservationsClicked.emit()"
        />
      } @else {
        <app-button variant="primary" size="medium" (clicked)="loginClicked.emit()">
          <ng-icon name="bootstrapBoxArrowInRight" size="18px" aria-hidden="true" />
          Iniciar sesión
        </app-button>
      }

      <a
        class="cart-action"
        routerLink="/guest/cart"
        aria-label="Ir al carrito"
        title="Ir al carrito"
      >
        <ng-icon name="bootstrapCart" size="18px" aria-hidden="true" />      </a>
    </div>

  </div>
</nav>
