<app-catalog-nav
  #bookingNav
  [isAuthenticated]="guestTokenService.isAuthenticated()"
  [guestEmail]="guestEmail"
  (loginClicked)="onGuestLogin()"
  (logoutClicked)="onGuestLogout()"
  (myReservationsClicked)="onMyReservations()">
</app-catalog-nav>

<app-booking-hero
  [initialStartDate]="startDate()"
  [initialEndDate]="endDate()"
  [initialMinGuests]="minGuests()"
  (searchSubmit)="onHeroSearch($event)">
</app-booking-hero>

<section class="results-section" #resultsSection>
  <div class="results-container">
    <app-booking-toolbar
      [resultsCount]="totalCount()"
      [sortBy]="sortBy()"
      [initialQuery]="searchQuery()"
      (searchQueryChange)="onSearchQueryChange($event)"
      (sortChange)="onSortChange($event)">
    </app-booking-toolbar>

    @if (isRoomsLoading()) {
      <div class="rooms-grid">
        @for (item of skeletonItems; track $index) {
          <app-catalog-skeleton-card></app-catalog-skeleton-card>
        }
      </div>
    } @else if (displayedRooms().length === 0) {
      <app-booking-empty-state></app-booking-empty-state>
    } @else {
      <div class="rooms-grid">
        @for (room of displayedRooms(); track room.id) {
          <app-booking-room-card
            [room]="room"
            (viewDetails)="goToRoomDetails($event)">
          </app-booking-room-card>
        }
      </div>
    }

    @if (totalPages() > 1) {
      <app-catalog-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [disabled]="isRoomsLoading()"
        (pageChange)="onPageChange($event)">
      </app-catalog-pagination>
    }
  </div>
</section>

<app-footer></app-footer>
