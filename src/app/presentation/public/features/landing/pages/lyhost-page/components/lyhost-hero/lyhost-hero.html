<section id="inicio" class="hero">
  <div class="wrap">
    <div class="g12 hero-top">
      <h1 class="h1 hero-h">
        <span class="ln"><span style="--d: 0.1s">{{ h.titleA }}</span></span>
        <span class="ln"><span class="muted" style="--d: 0.22s">{{ h.titleB }}</span></span>
      </h1>
      <div class="h-in hero-side" style="--d: 0.4s">
        <p class="lead">{{ h.lead }}</p>
        <div class="cta">
          <app-button variant="primary" (clicked)="goToRegister()">{{ h.startTrial }}</app-button>
          <app-button variant="secondary" (clicked)="scrollTo('planes')">
            {{ h.seePlans }} <span class="nudge" aria-hidden="true">→</span>
          </app-button>
        </div>
      </div>
    </div>

    <!-- The product, as the picture -->
    <div #fit class="fit-outer" [style.height]="fitOuterHeight()">
      <div class="fit-inner" [style.width]="fitInnerWidth()" [style.transform]="fitInnerTransform()">
        <div class="h-in prod-3d" style="--d: 0.5s">
          <div class="prod">
            <figure class="ap-cq" [attr.aria-label]="h.demoLabel">
              <div class="ap" aria-hidden="true">
                <!-- The panel's floating rail, collapsed -->
                <div class="ap-rail" aria-hidden="true">
                  <svg aria-hidden="true" width="22" height="22" viewBox="0 0 64 64" class="rail-logo">
                    <rect x="28" y="5" width="8" height="5" rx="2.5" fill="currentColor"></rect>
                    <rect x="19" y="13" width="26" height="5" rx="2.5" fill="currentColor"></rect>
                    <rect x="14" y="21" width="36" height="5" rx="2.5" fill="currentColor"></rect>
                    <rect x="12" y="29" width="40" height="5" rx="2.5" fill="currentColor"></rect>
                    <rect x="14" y="37" width="36" height="5" rx="2.5" fill="currentColor"></rect>
                    <rect x="19" y="45" width="26" height="5" rx="2.5" fill="currentColor"></rect>
                    <rect x="28" y="53" width="8" height="5" rx="2.5" fill="currentColor"></rect>
                  </svg>
                  <span class="ap-ni"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6l6 6-6 6M5 6l6 6-6 6"></path></svg></span>
                  <span class="ap-ni"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z"></path></svg></span>
                  <span class="ap-ni on"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v3M17 3v3M4 6h16v14H4zM4 10h16"></path></svg></span>
                  <span class="ap-ni"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4M15.5 4.2a3.5 3.5 0 0 1 0 6.6"></path></svg></span>
                  <span class="ap-ni"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-7M12 20V5M19 20v-10M3 20h18"></path></svg></span>
                  <span class="grow"></span>
                  <span class="ap-me">LG</span>
                </div>

                <!-- Header and page -->
                <div #main class="ap-main">
                  <div class="ap-top">
                    <span class="ap-ib ap-menu"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></span>
                    <span class="ap-scope">
                      <span class="ap-scope-ic"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"></path></svg></span>Casa Laureles<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
                    </span>
                    <span class="ap-crumb">{{ h.panel.section }} <i>/</i> <b>{{ h.panel.page }}</b></span>
                    <span class="grow"></span>
                    <span class="ap-search"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>{{ h.panel.search }}</span>
                    <span class="ap-ib ap-theme"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>
                    <span class="ap-ib"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg></span>
                  </div>

                  <div class="ap-head">
                    <div>
                      <div class="ap-h1">{{ h.panel.page }}</div>
                      <div class="ap-sub">{{ h.panel.showing }} <b>{{ h.panel.property }}</b></div>
                    </div>
                    <div class="ap-head-actions">
                      <span class="ap-pill"><span class="live-dot live"></span>{{ h.panel.synced }}</span>
                      <span class="ap-btn">{{ h.panel.newBooking }}</span>
                    </div>
                  </div>

                  <div class="ap-tools">
                    <span class="ap-chip"><span class="ap-sw ly"></span>{{ h.panel.direct }}<b>{{ directCount() }}</b></span>
                    <span class="ap-chip"><span class="ap-sw bk"></span>Booking.com<b>4</b></span>
                    <span class="ap-chip"><span class="ap-sw ab"></span>Airbnb<b>4</b></span>
                    <span class="grow"></span>
                    <span class="ap-muted ap-occ">{{ h.panel.occupancy }} {{ occupancy() }}</span>
                    <span class="ap-rng"><span class="ap-ib sm">‹</span><b>{{ rangeLabel() }}</b><span class="ap-ib sm">›</span></span>
                  </div>

                  <!-- The gantt: one row per unit, bars from afternoon arrival to morning departure -->
                  <app-lyhost-calendar [stays]="stays" [from]="from()" [cols]="cols()" [showToday]="true">
                    @if (demo().sel > 0) {
                      <div class="ap-sel" [style.top]="selTop" [style.left]="selLeft()" [style.width]="selWidth()">{{ demo().sel >= 4 ? h.panel.selection : '' }}</div>
                    }
                    @if (demo().booked) {
                      <div
                        class="ap-bar ly ap-new"
                        [style.top]="selTop"
                        [style.left]="selLeft()"
                        [style.width]="newWidth()"
                        [style.opacity]="demo().fade ? 0 : 1"
                      >
                        <span class="ap-src">L</span><span class="ap-gname">Ana Restrepo</span>
                      </div>
                    }
                  </app-lyhost-calendar>

                  <!-- The confirmation, as the panel shows it -->
                  <div class="toast" [class.toast-on]="demo().toast" aria-hidden="true">
                    {{ h.panel.toast }}
                  </div>

                  <!-- The new-reservation panel, step 2 of 3 -->
                  <div class="drawer" [class.drawer-open]="demo().drawer" aria-hidden="true">
                    <div class="ap-dhead">
                      <div class="ap-dtitle"><span>{{ h.panel.drawerTitle }}</span><span class="ap-ib sm">✕</span></div>
                      <span class="ap-muted">{{ h.panel.drawerStep }}</span>
                      <span class="ap-track-s"><span style="width: 66%"></span></span>
                    </div>
                    <div class="ap-dbody">
                      <div class="ap-stay">
                        <div><span>{{ h.panel.arrival }}</span><b>{{ h.panel.arrivalDate }}</b></div>
                        <span class="ap-n">{{ h.panel.nights }}</span>
                        <div class="ap-stay-end"><span>{{ h.panel.departure }}</span><b>{{ h.panel.departureDate }}</b></div>
                      </div>
                      <div class="ap-muted mono ap-stay-meta">{{ h.panel.stayMeta }}</div>
                      <div #guest class="ap-field">
                        <span class="flabel">{{ h.panel.guestName }}</span>
                        <div class="fbox" [class.fbox-focus]="demo().focus">{{ demo().typed }}@if (demo().focus) {<span class="caret"></span>}@if (!demo().focus && demo().typed === '') {<span class="ap-placeholder">Ana Restrepo</span>}</div>
                      </div>
                      <div class="ap-recurring" [class.chip-show]="demo().chip" [class.chip-hide]="!demo().chip">
                        <span class="ap-tag">{{ h.panel.recurring }}</span>
                        <span class="ap-muted">{{ h.panel.recurringMeta }}</span>
                      </div>
                      <div class="ap-field">
                        <span class="flabel">{{ h.panel.phone }}</span>
                        <div class="fbox">300 555 0148</div>
                      </div>
                      <div class="ap-field">
                        <span class="flabel">{{ h.panel.payment }}</span>
                        <div class="ap-pay"><span class="ap-chip sm on">{{ h.panel.paid }}</span><span class="ap-chip sm">{{ h.panel.pending }}</span></div>
                      </div>
                    </div>
                    <div class="ap-dfoot">
                      <span class="ap-btn sec">{{ h.panel.back }}</span>
                      <span #confirm class="ap-btn" [class.press]="demo().press">{{ h.panel.create }}</span>
                    </div>
                  </div>

                  <!-- The person using it -->
                  <div
                    class="cursor"
                    [class.cursor-down]="demo().down"
                    aria-hidden="true"
                    [style.transform]="cursorTransform()"
                    [style.opacity]="demo().on ? 1 : 0"
                  >
                    <span [class]="rippleClass()"></span>
                    <svg aria-hidden="true" width="20" height="22" viewBox="0 0 20 22"><path d="M2 1.5L2 17.5L6.4 13.6L9.3 20.2L12.3 18.9L9.4 12.4L15.3 12.1Z" fill="#10201b" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"></path></svg>
                  </div>
                </div>
              </div>
            </figure>
            @if (!reducedMotion()) {
              <button
                type="button"
                class="demo-pause"
                [attr.aria-label]="paused() ? h.resume : h.pause"
                (click)="toggleDemo()"
              >
                <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                  <path [attr.d]="paused() ? 'M8 5v14l11-7z' : 'M7 5h4v14H7zM13 5h4v14h-4z'"></path>
                </svg>
              </button>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Facts strip -->
<section class="facts-band" [attr.aria-label]="h.factsLabel">
  <div class="wrap">
    <div class="dx">
      <div class="rule-x" aria-hidden="true"></div>
      <div class="facts stg">
        @for (fact of facts; track fact.title; let i = $index) {
          <div class="fact" [style.--i]="i">
            <span class="fact-title">{{ fact.title }}</span>
            <span class="fact-text">{{ fact.text }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</section>
