<header class="nav-bar">
  <nav class="wrap nav-inner" aria-label="Principal">
    <button type="button" class="brand" aria-label="LyHost, inicio" (click)="scrollTo('inicio')">
      <img ngSrc="images/lyhost-logo.svg" width="141" height="52" priority alt="LyHost" />
    </button>

    <div class="links">
      @for (link of links; track link.sectionId) {
        <button type="button" class="navlink" (click)="scrollTo(link.sectionId)">{{ link.label }}</button>
      }
    </div>

    <div class="actions">
      <button type="button" class="navlink login" (click)="goTo('/login')">Iniciar sesión</button>
      <app-button variant="primary" (clicked)="goTo('/register')">Prueba gratis</app-button>
    </div>
  </nav>
  <div class="scroll-prog" aria-hidden="true"></div>
</header>
