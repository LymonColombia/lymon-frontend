<article class="experience-card">
  <button
    class="experience-card-overlay"
    type="button"
    [attr.aria-label]="'Ver detalles de ' + titleLabel()"
    (click)="onCardClick()"
  ></button>

  <div class="experience-image">
    <img class="experience-image-photo"
      [src]="imageUrl()"
      [alt]="titleLabel()"
    />

    <div class="image-gradient" aria-hidden="true"></div>

    <button
      class="like-btn"
      type="button"
      tabindex="0"
      [class.liked]="isLiked()"
      (click)="onToggleLike($event)"
      [attr.aria-label]="isLiked() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
    >
      @if (isLiked()) {
        <ng-icon name="bootstrapHeartFill" size="14px" aria-hidden="true"></ng-icon>
      } @else {
        <ng-icon name="bootstrapHeart" size="14px" aria-hidden="true"></ng-icon>
      }
    </button>

    <div class="price-overlay">
      <span class="price-amount">{{ priceLabel() }}</span>
      <span class="price-period">/persona</span>
    </div>
  </div>

  <div class="experience-content">
    <div class="experience-meta">
      <span class="experience-location">
        <ng-icon name="bootstrapGeoAlt" size="12px" aria-hidden="true"></ng-icon>
        {{ locationLabel() }}
      </span>
      <span class="experience-location">
        <ng-icon name="bootstrapClock" size="12px" aria-hidden="true"></ng-icon>
        {{ durationLabel() }}
      </span>
    </div>

    <div class="title-row">
      <h3 class="experience-title" [title]="experience().name">{{ getTitlePreview() }}</h3>
      @if (hostCertified()) {
        <span class="cert-medal" aria-label="Host certificado">
          <ng-icon name="bootstrapPatchCheckFill" size="20px" aria-hidden="true"></ng-icon>
        </span>
      }
    </div>

    <p class="experience-description" [title]="experience().description">{{ getDescriptionPreview() }}</p>

    <div class="experience-features">
      <div class="feature">
        <ng-icon class="feature-icon" name="bootstrapClock" size="14px" aria-hidden="true"></ng-icon>
        <span>{{ durationLabel() }}</span>
      </div>

      <div class="feature">
        <ng-icon class="feature-icon" name="bootstrapPeopleFill" size="14px" aria-hidden="true"></ng-icon>
        <span>{{ capacityLabel() }}</span>
      </div>
    </div>

    <div class="experience-categories">
        <span class="experience">{{ categoryLabel() }}</span>
    </div>

  </div>
</article>
