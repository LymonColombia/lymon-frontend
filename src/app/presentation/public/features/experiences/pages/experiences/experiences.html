<app-catalog-nav
  [isAuthenticated]="guestTokenService.isAuthenticated()"
  [guestEmail]="guestEmail"
  (loginClicked)="onGuestLogin()"
  (logoutClicked)="onGuestLogout()"
  (myReservationsClicked)="onMyReservations()">
</app-catalog-nav>

<app-experience-hero
  [selectedCategory]="selectedCategory()"
  (filtersApply)="onHeroFiltersApply($event)">
</app-experience-hero>

<section class="experiences-section" #resultsSection aria-label="Experiencias">
  <div class="experiences-container">
    <app-experience-toolbar
      [resultsCount]="filteredExperiences().length"
      [sortBy]="sortBy()"
      [selectedCategory]="selectedCategory()"
      (searchQueryChange)="onSearchQueryChange($event)"
      (sortChange)="onSortChange($event)"
      (categoryChange)="onCategoryChange($event)">
       </app-experience-toolbar>

    @if (isExperienceLoading()) {
      <div class="experiences-grid experiences-grid--loading">
        @for (item of skeletonItems; track $index) {
          <app-catalog-skeleton-card></app-catalog-skeleton-card>
        }
      </div>
    } @else if (filteredExperiences().length === 0) {
      <app-experience-empty-state
        title="No encontramos experiencias"
        message="Intenta ajustar tu busqueda o tus filtros para ver mas opciones.">
      </app-experience-empty-state>
    } @else {
      <div class="experiences-grid">
        @for (experience of filteredExperiences(); track experience.id) {
          <app-experience-card
            [experience]="experience"
            [isLiked]="likedExperiencesIds().has(experience.id)"
            (viewDetails)="goToExperienceDetails($event)"
            (toggleLike)="onToggleLike($event)">
          </app-experience-card>
        }
      </div>

      <app-catalog-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        (pageChange)="onPageChange($event)">
      </app-catalog-pagination>
    }
  </div>
</section>

<app-footer></app-footer>
