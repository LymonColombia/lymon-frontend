<aside
  class="rail"
  [class.rail--expanded]="expanded()"
  [class.rail--open]="mobileOpen()"
  aria-label="Navegación principal"
>
  <div class="brand">
    <a class="brand-link" routerLink="/admin/dashboard" aria-label="LyHost, ir al inicio">
      <img class="brand-mark" [src]="markSrc()" alt="" width="26" height="26" />
      <img
        class="brand-logo lbl"
        [src]="'/images/lyhost-logo' + logoSuffix() + '.svg'"
        alt=""
        width="82"
        height="30"
      />
    </a>
  </div>

  <button
    type="button"
    class="nav-item toggle"
    [attr.aria-expanded]="expanded()"
    [attr.data-tip]="expanded() ? 'Contraer menú' : 'Expandir menú'"
    (click)="toggleRail()"
  >
    <ng-icon class="chev" name="bootstrapChevronDoubleRight" size="18" aria-hidden="true" />
    <span class="lbl">{{ expanded() ? 'Contraer menú' : 'Expandir menú' }}</span>
  </button>

  <nav class="nav" aria-label="Módulos">
    <a
      class="nav-item"
      [routerLink]="home.route"
      routerLinkActive="on"
      ariaCurrentWhenActive="page"
      [attr.data-tip]="home.label"
    >
      <ng-icon [name]="home.icon" size="18" aria-hidden="true" />
      <span class="lbl">{{ home.label }}</span>
    </a>

    @for (group of groups; track group.id) {
      <div class="group" [class.group--open]="isOpen(group)">
        <button
          type="button"
          class="nav-item"
          [class.is-current]="currentGroupId() === group.id"
          [attr.aria-expanded]="isOpen(group) && expanded()"
          [attr.aria-controls]="'subs-' + group.id"
          [attr.data-tip]="group.label"
          (click)="toggleGroup(group)"
        >
          <ng-icon [name]="group.icon" size="18" aria-hidden="true" />
          <span class="lbl">{{ group.label }}</span>
          <ng-icon class="lbl group-chev" name="bootstrapChevronDown" size="16" aria-hidden="true" />
        </button>

        <div class="subs-wrap" [id]="'subs-' + group.id">
          <div class="subs">
            <div class="subs-in">
              @for (item of group.items; track item.route) {
                <a
                  class="sub"
                  [routerLink]="item.route"
                  routerLinkActive="on"
                  ariaCurrentWhenActive="page"
                >
                  {{ item.label }}
                </a>
              }
            </div>
          </div>
        </div>
      </div>
    }
  </nav>

  <app-ui-menu
    #menu
    class="me-menu"
    label="Opciones de perfil"
    placement="above"
    align="start"
    [(open)]="profileOpen"
  >
    <button menuTrigger type="button" class="me" aria-haspopup="menu" [attr.aria-expanded]="menu.open()">
      <app-ui-avatar [name]="displayName()" />
      <span class="lbl me-text">
        <span class="me-name">{{ displayName() }}</span>
        <span class="me-email">{{ displayEmail() }}</span>
      </span>
    </button>

    <app-ui-menu-item (click)="goToSettings()">
      <ng-icon name="bootstrapGear" size="16" aria-hidden="true" />
      Configuración
    </app-ui-menu-item>
    <app-ui-menu-item tone="danger" (click)="logoutOpen.set(true)">
      <ng-icon name="bootstrapBoxArrowRight" size="16" aria-hidden="true" />
      Cerrar sesión
    </app-ui-menu-item>
  </app-ui-menu>
</aside>

<app-ui-dialog [(open)]="logoutOpen" heading="Cerrar sesión">
  ¿Seguro que quieres cerrar sesión?
  <ng-container dialogActions>
    <app-ui-button variant="secondary" (click)="logoutOpen.set(false)">Cancelar</app-ui-button>
    <app-ui-button (click)="confirmLogout()">Cerrar sesión</app-ui-button>
  </ng-container>
</app-ui-dialog>
