<app-tenant-page-layout
  [title]="pageTitle()"
  iconName="bootstrapStars"
  backLink="/admin/experiences"
  backLabel="Volver a experiencias"
>
  @if (isEditing()) {
    <span tenantPageMeta class="edit-chip">Modo edicion</span>
  }

  @if (successMessage()) {
    <div class="alert alert-success">{{ successMessage() }}</div>
  }

  <app-modal
    [open]="saveErrorModalOpen()"
    [title]="saveErrorTitle()"
    size="small"
    (closed)="closeSaveErrorModal()"
  >
    <div class="save-error-content">
      <p class="save-error-message">{{ saveErrorMessage() }}</p>
      <p class="save-error-help">Revisa los datos del formulario e inténtalo nuevamente.</p>
    </div>

    <div modal-footer class="modal-actions">
      <button type="button" class="close-error-button" (click)="closeSaveErrorModal()">
        Entendido
      </button>
    </div>
  </app-modal>

  @if (isLoading()) {
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p>Cargando experiencia...</p>
    </div>
  } @else {
    <app-experience-form
      [initialExperience]="editingExperience()"
      [isSaving]="isSaving()"
      [propertyOptions]="propertyOptions()"
      [unitOptions]="unitOptions()"
      [unitsLoading]="unitsLoading()"
      (submitted)="onSubmitExperience($event)"
      (cancelled)="onCancel()"
      (propertyChanged)="onPropertyChanged($event)"
    />
  }
</app-tenant-page-layout>
