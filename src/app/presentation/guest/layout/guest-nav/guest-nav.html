<nav class="guest-nav">
  <div class="guest-nav-inner">

    <button class="nav-explore-btn" type="button" (click)="onExplore()">
      <ng-icon name="bootstrapChevronLeft" size="15px" aria-hidden="true" />
      {{ backButtonLabel() }}
    </button>

    <a routerLink="/booking" class="nav-logo">
      <img src="/images/LyHost.svg" alt="LyHost" />
    </a>

    <div class="nav-actions">
      <div class="nav-profile-wrapper">
        <button type="button" class="nav-profile"
            aria-haspopup="menu"
            [attr.aria-expanded]="isDropdownOpen()" (click)="toggleDropdown()" [class.nav-profile--open]="isDropdownOpen()">
          <span class="profile-avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="profile-info">
            <span class="profile-name">{{ profileLabel() }}</span>
            <span class="profile-email">{{ guestEmail() }}</span>
          </span>
          <ng-icon
            name="bootstrapChevronDown"
            size="13px"
            class="profile-chevron"
            [class.profile-chevron--open]="isDropdownOpen()"
            aria-hidden="true"
          />
        </button>

        @if (isDropdownOpen()) {
          <div class="profile-dropdown" role="menu" aria-label="Profile actions">
            <button class="profile-dropdown-option profile-dropdown-option--danger" type="button" role="menuitem" (click)="onLogout()">
              <ng-icon name="bootstrapBoxArrowRight" size="15px" aria-hidden="true" />
              Cerrar sesión
            </button>
          </div>
        }
      </div>

      <a class="cart-action" routerLink="/guest/cart" aria-label="Ir al carrito" title="Ir al carrito">
        <ng-icon name="bootstrapCart" size="18px" aria-hidden="true" />
      </a>
    </div>

  </div>
</nav>
