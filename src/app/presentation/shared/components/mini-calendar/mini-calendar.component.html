<div class="mini-cal">
  <div class="cal-header">
    <button
      class="cal-nav-btn"
      type="button"
      (click)="prevMonth()"
      [disabled]="isAtCurrentMonth()"
      aria-label="Mes anterior">
      <ng-icon name="bootstrapChevronLeft" size="12px" aria-hidden="true"></ng-icon>
    </button>
    <span class="cal-month-label">{{ monthLabel() }}</span>
    <button class="cal-nav-btn" type="button" (click)="nextMonth()" aria-label="Mes siguiente">
      <ng-icon name="bootstrapChevronRight" size="12px" aria-hidden="true"></ng-icon>
    </button>
  </div>

  @if (prompt()) {
    <p class="cal-prompt">{{ prompt() }}</p>
  }

  <div class="cal-weekdays">
    @for (wd of weekdays; track wd) {
      <span class="cal-weekday">{{ wd }}</span>
    }
  </div>

  <div class="cal-days" (mouseleave)="onCalDaysMouseLeave()">
    @for (day of calendarDays(); track day.date.getTime()) {
      <button
        type="button"
        class="cal-day"
        [class.other-month]="!day.isCurrentMonth"
        [class.is-today]="day.isToday"
        [class.is-past]="day.isPast"
        [class.is-occupied]="day.isOccupied"
        [class.is-start]="day.isStart"
        [class.is-end]="day.isEnd"
        [class.in-range]="day.isInRange"
        [class.is-in-hover-range]="day.isInHoverRange"
        [class.is-hover-end]="day.isHoverEnd"
        [class.is-hover-invalid]="day.isHoverInvalid"
        [disabled]="!day.isCurrentMonth || day.isPast || day.isOccupied"
        (mouseenter)="onDayMouseEnter(day)"
        (click)="onDayClick(day)">
        {{ day.day }}
      </button>
    }
  </div>
</div>
