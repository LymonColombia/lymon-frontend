<span class="field-label-row">
  <label [for]="forId()">
    {{ label() }}
    @if (required()) {
      <span class="required">*</span>
    }
  </label>

  @if (description()) {
    <app-hotel-tooltip [ariaLabel]="'Ayuda ' + label()" position="top">
      <strong>{{ label() }}</strong>
      {{ description() }}
    </app-hotel-tooltip>
  }
</span>
