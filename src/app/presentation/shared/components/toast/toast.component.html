@if (toastService.toasts().length) {
  <section class="toast-container" aria-live="polite" aria-label="Notificaciones">
    @for (toast of toastService.toasts(); track toast.id) {
      <div class="toast toast--{{ toast.type }}">
        <ng-icon [name]="iconName(toast.type)" size="18px" aria-hidden="true"></ng-icon>
        <span class="toast-message">{{ toast.message }}</span>
        <button
          type="button"
          class="toast-close"
          (click)="toastService.remove(toast.id)"
          aria-label="Cerrar notificación"
        >
          <ng-icon name="bootstrapX" size="14px" aria-hidden="true"></ng-icon>
        </button>
      </div>
    }
  </section>
}
